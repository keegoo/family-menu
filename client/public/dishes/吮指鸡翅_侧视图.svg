<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#FFF4DA"/>

  <!-- bowl -->
  <ellipse cx="32" cy="34" rx="25" ry="21" fill="#D99A48"/>
  <ellipse cx="32" cy="31" rx="22" ry="18" fill="#F2C875"/>

  <!-- thick potato slices underneath -->
  <g fill="#F4D58A" stroke="#D5A94F" stroke-width="1">
    <ellipse cx="20" cy="24" rx="7" ry="5"/>
    <ellipse cx="31" cy="22" rx="7" ry="5"/>
    <ellipse cx="42" cy="25" rx="7" ry="5"/>
    <ellipse cx="16" cy="34" rx="7" ry="5"/>
    <ellipse cx="27" cy="32" rx="7" ry="5"/>
    <ellipse cx="39" cy="34" rx="7" ry="5"/>
    <ellipse cx="48" cy="35" rx="6" ry="5"/>
    <ellipse cx="22" cy="42" rx="7" ry="5"/>
    <ellipse cx="34" cy="43" rx="7" ry="5"/>
    <ellipse cx="44" cy="43" rx="6" ry="5"/>
  </g>

  <!-- baked chicken wings -->
  <g fill="#9E4228" stroke="#71301F" stroke-width="1">
    <path d="M18 27c-3-5-1-9 3-10 4-1 7 2 8 6l-2 7-5 2z"/>
    <path d="M27 20c2-5 6-7 9-5 4 2 4 6 1 9l-6 4-5-2z"/>
    <path d="M37 27c-1-5 2-8 6-8 4 0 6 4 5 8l-4 6-6-1z"/>
    <path d="M23 34c-3-4-1-8 3-9 4-1 7 2 7 6l-3 6-5 1z"/>
    <path d="M34 36c0-5 3-8 7-7 4 1 5 5 3 9l-5 4-5-2z"/>
  </g>

  <!-- roasted highlights -->
  <g fill="#D56A32">
    <ellipse cx="23" cy="20" rx="3" ry="1.5" transform="rotate(25 23 20)"/>
    <ellipse cx="33" cy="18" rx="3" ry="1.5" transform="rotate(-20 33 18)"/>
    <ellipse cx="44" cy="25" rx="3" ry="1.5" transform="rotate(20 44 25)"/>
    <ellipse cx="28" cy="33" rx="3" ry="1.5" transform="rotate(-15 28 33)"/>
    <ellipse cx="39" cy="37" rx="3" ry="1.5" transform="rotate(20 39 37)"/>
  </g>

  <!-- sesame -->
  <g fill="#FFE7A8">
    <circle cx="20" cy="24" r="0.8"/>
    <circle cx="31" cy="22" r="0.8"/>
    <circle cx="43" cy="28" r="0.8"/>
    <circle cx="27" cy="28" r="0.8"/>
    <circle cx="37" cy="34" r="0.8"/>
  </g>
</svg>
